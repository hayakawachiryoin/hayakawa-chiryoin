<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ・ご予約 | 早川治療院</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
h1 { color: #2A8B9D; }
label { display: block; margin-top: 16px; font-weight: bold; }
input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
button { margin-top: 20px; background: #2A8B9D; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>お問い合わせ・ご予約</h1>
<form action="https://formspree.io/f/xnjoyonn" method="POST">
<label>お名前<input type="text" name="name" required></label>
<label>電話番号<input type="tel" name="phone"></label>
<label>メールアドレス<input type="email" name="email"></label>
<label>メッセージ<textarea name="message" rows="5" required></textarea></label>
<button type="submit">送信する</button>
</form>
</body>
</html>
